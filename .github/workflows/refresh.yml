name: refresh-data

# 每天定时刷新数据并发布到 GitHub Pages（Asia/Shanghai = UTC+8）
# UTC 22:30 = 北京 06:30（美股收盘净值更新后）；UTC 04:30 = 北京 12:30（午盘后）
on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run refresh
        run: python run.py refresh

      - name: Publish to docs (GitHub Pages)
        run: |
          mkdir -p docs
          cp web/index.html docs/index.html
          cp data/snapshot.json docs/snapshot.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/snapshot.json
          git diff --cached --quiet || (git commit -m "chore: refresh snapshot $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
